<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomify Ai - Pro Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --canvas-bg: #f8fafc; --grid: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--dark); color: white; overflow: hidden; }
        
        /* Sidebar & Layout */
        .editor-layout { display: grid; grid-template-columns: 280px 1fr 250px; height: 100vh; }
        .sidebar { background: #1e293b; border-right: 1px solid #334155; padding: 20px; z-index: 10; }
        .right-panel { background: #1e293b; border-left: 1px solid #334155; padding: 20px; }

        /* Furniture Items (Realistic Thumbnails) */
        .furniture-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .item-card { background: #334155; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; transition: 0.2s; }
        .item-card:hover { background: var(--primary); }
        .item-card img { width: 100%; height: 60px; object-fit: contain; margin-bottom: 5px; }
        .item-card span { font-size: 0.75rem; }

        /* Drafting Canvas */
        .canvas-area { background: var(--canvas-bg); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #editor-canvas { 
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
            cursor: crosshair;
        }

        /* Mode Buttons */
        .mode-switch { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: white; padding: 5px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .mode-btn { padding: 8px 25px; border-radius: 20px; border: none; cursor: pointer; font-weight: 600; color: #64748b; background: transparent; }
        .mode-btn.active { background: var(--primary); color: white; }

        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .hidden { display: none !important; }
        #marketing-view { position: fixed; inset: 0; background: var(--dark); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <!-- Landing / Registration (Simplified) -->
    <div id="marketing-view">
        <div style="text-align: center; max-width: 400px; padding: 40px; background: #1e293b; border-radius: 20px;">
            <h1 style="margin-bottom: 20px;">Roomify Ai</h1>
            <p style="opacity: 0.7; margin-bottom: 30px;">Բարի գալուստ պրոֆեսիոնալ դիզայնի աշխարհ:</p>
            <button class="btn" onclick="startApp()">Սկսել Աշխատանքը</button>
        </div>
    </div>

    <!-- Main Editor -->
    <div id="app-view" class="hidden">
        <div class="editor-layout">
            <!-- Left Sidebar -->
            <div class="sidebar">
                <h3>Կատալոգ</h3>
                <div class="furniture-grid">
                    <div class="item-card" onclick="addFurniture('bed')">
                        <img src="https://www.floorplanner.com/assets/editor/objects/bed.png" alt="Bed">
                        <span>Մահճակալ</span>
                    </div>
                    <div class="item-card" onclick="addFurniture('sofa')">
                        <img src="https://www.floorplanner.com/assets/editor/objects/sofa.png" alt="Sofa">
                        <span>Բազմոց</span>
                    </div>
                    <div class="item-card" onclick="addFurniture('table')">
                        <img src="https://www.floorplanner.com/assets/editor/objects/table.png" alt="Table">
                        <span>Սեղան</span>
                    </div>
                    <div class="item-card" onclick="addFurniture('plant')">
                        <img src="https://www.floorplanner.com/assets/editor/objects/plant.png" alt="Plant">
                        <span>Բույս</span>
                    </div>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="canvas-area">
                <div class="mode-switch">
                    <button id="btn-2d" class="mode-btn active" onclick="setMode('2d')">2D</button>
                    <button id="btn-3d" class="mode-btn" onclick="setMode('3d')">3D View</button>
                </div>
                <div id="canvas-container">
                    <svg id="editor-canvas" width="1000" height="700"></svg>
                </div>
            </div>

            <!-- Right Inspector -->
            <div class="right-panel">
                <h3>Հատկություններ</h3>
                <div id="inspector-msg" style="margin-top: 20px; font-size: 0.9rem; opacity: 0.6;">
                    Ընտրեք տարրը՝ փոփոխելու համար
                </div>
                <div id="controls" class="hidden">
                    <p style="margin-top: 20px; font-size: 0.8rem;">Պտտել: R</p>
                    <p style="font-size: 0.8rem;">Չափս: + / -</p>
                    <button class="btn" style="background: #ef4444;" onclick="deleteSelected()">Ջնջել</button>
                </div>
                <button class="btn" style="margin-top: auto; background: #334155;" onclick="location.reload()">Ելք</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
