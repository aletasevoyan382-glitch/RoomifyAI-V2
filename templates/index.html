<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomify Ai - Pro Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --2d-bg: #ffffff; --3d-bg: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--dark); color: white; overflow: hidden; }

        /* Auth & Dashboard */
        .full-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2000; background: var(--dark); }
        .card { background: #1e293b; padding: 40px; border-radius: 24px; width: 100%; max-width: 450px; text-align: center; border: 1px solid #334155; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; margin-top: 5px; }

        /* Editor Layout */
        .editor-layout { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
        .sidebar { background: #1e293b; border-right: 1px solid #334155; padding: 20px; z-index: 100; }
        .furniture-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .item-card { background: #334155; padding: 10px; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.2s; }
        .item-card:hover { background: var(--primary); }
        .item-card img { width: 100%; height: 60px; object-fit: contain; margin-bottom: 5px; filter: brightness(1.2); }

        /* Canvas Styles */
        .canvas-area { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        #editor-canvas { background: var(--2d-bg); transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        
        /* Dashboard Modules */
        .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; }
        .module-card { background: #1e293b; padding: 40px; border-radius: 20px; cursor: pointer; border: 1px solid #334155; transition: 0.3s; }
        .module-card:hover { transform: translateY(-10px); border-color: var(--primary); }

        /* Floating Mode Switch */
        .mode-switch { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; background: rgba(255,255,255,0.9); padding: 5px; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 1000; }
        .mode-btn { padding: 10px 30px; border-radius: 30px; border: none; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .mode-btn.active { background: var(--primary); color: white; }

        .hidden { display: none !important; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 1. Registration -->
    <div id="auth-view" class="full-screen">
        <div class="card">
            <h1 style="margin-bottom: 10px;">Roomify Ai</h1>
            <p style="opacity: 0.6; margin-bottom: 30px;">Սկսեք ձեր պրոֆեսիոնալ նախագիծը</p>
            <form onsubmit="event.preventDefault(); showDashboard();">
                <div class="input-group"><label>Անուն</label><input type="text" required></div>
                <div class="input-group"><label>Էլ. հասցե</label><input type="email" required></div>
                <button type="submit" class="btn">Ստեղծել Հաշիվ</button>
            </form>
        </div>
    </div>

    <!-- 2. Dashboard -->
    <div id="dashboard-view" class="full-screen hidden">
        <div class="module-grid">
            <div class="module-card" onclick="startApp('2d')"><h2 style="font-size: 3rem;">📐</h2><h3>2D Blueprint</h3><p>Սպիտակ հատակագիծ</p></div>
            <div class="module-card" onclick="startApp('3d')"><h2 style="font-size: 3rem;">🏠</h2><h3>3D Realistic</h3><p>Ծավալային մոդել</p></div>
            <div class="module-card" onclick="openScanner()"><h2 style="font-size: 3rem;">🤖</h2><h3>AI Scan</h3><p>Լուսանկարից՝ կոդ</p></div>
        </div>
    </div>

    <!-- 3. Editor -->
    <div id="app-view" class="hidden">
        <div class="editor-layout">
            <div class="sidebar">
                <h3 style="color: var(--primary); margin-bottom: 20px;">Roomify Ai Pro</h3>
                <div class="furniture-grid">
                    <div class="item-card" onclick="addFurniture('bed')"><img src="https://img.icons8.com/ios-filled/100/ffffff/double-bed.png"><br>Մահճակալ</div>
                    <div class="item-card" onclick="addFurniture('sofa')"><img src="https://img.icons8.com/ios-filled/100/ffffff/sofa.png"><br>Բազմոց</div>
                    <div class="item-card" onclick="addFurniture('table')"><img src="https://img.icons8.com/ios-filled/100/ffffff/table.png"><br>Սեղան</div>
                    <div class="item-card" onclick="addFurniture('plant')"><img src="https://img.icons8.com/ios-filled/100/ffffff/potted-plant.png"><br>Բույս</div>
                </div>
                <div style="margin-top: auto; padding-top: 20px;">
                    <button class="btn" style="background: #334155;" onclick="location.reload()">Ելք</button>
                </div>
            </div>

            <div class="canvas-area" id="canvas-area">
                <div class="mode-switch">
                    <button id="btn-2d" class="mode-btn active" onclick="setMode('2d')">2D View</button>
                    <button id="btn-3d" class="mode-btn" onclick="setMode('3d')">3D Real</button>
                </div>
                <div id="canvas-container">
                    <svg id="editor-canvas" width="1000" height="750"></svg>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
