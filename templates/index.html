<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomify Ai - Pro Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --canvas-2d: #ffffff; --canvas-3d: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--dark); color: white; overflow: hidden; }

        /* Auth Screen */
        .full-screen { position: fixed; inset: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .card { background: #1e293b; padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; margin-top: 5px; }

        /* Dashboard */
        .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; width: 90%; }
        .module-card { background: #1e293b; padding: 40px; border-radius: 20px; cursor: pointer; border: 1px solid #334155; transition: 0.3s; text-align: center; }
        .module-card:hover { border-color: var(--primary); transform: translateY(-10px); }

        /* Editor Layout */
        .editor-layout { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
        .sidebar { background: #1e293b; border-right: 1px solid #334155; padding: 20px; overflow-y: auto; }
        .category-title { font-size: 0.75rem; text-transform: uppercase; color: #64748b; margin: 20px 0 10px; font-weight: 800; }
        .furniture-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-card { background: #334155; padding: 10px; border-radius: 12px; cursor: pointer; text-align: center; font-size: 0.7rem; }
        .item-card img { width: 100%; height: 50px; object-fit: contain; margin-bottom: 5px; filter: brightness(1.1); }

        /* Canvas Area */
        .canvas-area { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #e2e8f0; transition: 0.5s; }
        #editor-canvas { background: white; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 50px rgba(0,0,0,0.2); }
        
        .mode-switch { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; background: white; padding: 5px; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 1000; }
        .mode-btn { padding: 8px 25px; border-radius: 30px; border: none; cursor: pointer; font-weight: 700; color: #64748b; }
        .mode-btn.active { background: var(--primary); color: white; }

        #scan-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 4000; display: none; align-items: center; justify-content: center; flex-direction: column; }
        .hidden { display: none !important; }
        .btn-pro { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Registration -->
    <div id="auth-view" class="full-screen">
        <div class="card">
            <h1 style="margin-bottom: 20px;">Roomify Ai</h1>
            <form onsubmit="event.preventDefault(); showDashboard();">
                <div class="input-group"><label>Էլ. հասցե</label><input type="email" required></div>
                <div class="input-group"><label>Գաղտնաբառ</label><input type="password" required></div>
                <button type="submit" class="btn-pro">Մուտք գործել</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view" class="full-screen hidden">
        <div class="module-grid">
            <div class="module-card" onclick="openModule('2d')"><h2>📐</h2><h3>2D Drafting</h3><p>Ճարտարապետական պլան</p></div>
            <div class="module-card" onclick="openModule('3d')"><h2>🏠</h2><h3>3D Realistic</h3><p>Ծավալային մոդելավորում</p></div>
            <div class="module-card" onclick="openScanner()"><h2>🤖</h2><h3>AI Scanning</h3><p>Լուսանկարից՝ 2D պլան</p></div>
        </div>
    </div>

    <!-- AI Scan Modal -->
    <div id="scan-overlay">
        <h2>Վերբեռնեք սենյակի լուսանկարը</h2>
        <input type="file" id="ai-input" style="margin: 20px 0; color: white;">
        <button class="btn-pro" style="width: 250px;" onclick="handleScan()">Սկսել AI Սկանավորումը</button>
        <button onclick="this.parentElement.style.display='none'" style="margin-top:20px; background:none; color:white; border:none; cursor:pointer;">Չեղարկել</button>
    </div>

    <!-- Main Editor -->
    <div id="app-view" class="hidden">
        <div class="editor-layout">
            <div class="sidebar">
                <h3 style="color: var(--primary); margin-bottom: 20px;">Roomify Ai Pro</h3>
                
                <div class="category-title">Կահույք</div>
                <div class="furniture-grid">
                    <div class="item-card" onclick="addFurniture('bed')"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQusjLZs5ghmvnjUwW8VNnL9fZTkojXA_TEIw&s"><br>Մահճակալ</div>
                    <div class="item-card" onclick="addFurniture('sofa')"><img src="https://img.icons8.com/ios-filled/100/ffffff/sofa.png"><br>Բազմոց</div>
                    <div class="item-card" onclick="addFurniture('table')"><img src="https://img.icons8.com/ios-filled/100/ffffff/table.png"><br>Սեղան</div>
                    <div class="item-card" onclick="addFurniture('plant')"><img src="https://img.icons8.com/ios-filled/100/ffffff/potted-plant.png"><br>Բույս</div>
                </div>

                <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155;">
                    <button class="btn-pro" style="background: #334155;" onclick="location.reload()">Վերադառնալ</button>
                </div>
            </div>

            <div class="canvas-area" id="bg-area">
                <div class="mode-switch">
                    <button id="btn-2d" class="mode-btn active" onclick="setMode('2d')">2D View</button>
                    <button id="btn-3d" class="mode-btn" onclick="setMode('3d')">3D Real</button>
                </div>
                <div id="canvas-container"><svg id="editor-canvas" width="1000" height="750"></svg></div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
